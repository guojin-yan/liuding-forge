name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release, Debug]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate compatibility source
        shell: bash
        run: |
          python tools/compatibility.py --file compatibility.json --validate
          echo "LIBTORCH_VERSION=$(python tools/compatibility.py --file compatibility.json --version compatibility_candidate)" >> "$GITHUB_ENV"
          python tools/dependency_manifest.py --file dependency-manifest.json

      - name: Install foundation quality tools
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy doxygen

      - name: Download LibTorch (CPU)
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" == "Windows" ]; then
            curl -L --retry 3 -o libtorch.zip \
              "https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-${LIBTORCH_VERSION}%2Bcpu.zip"
          elif [ "$RUNNER_OS" == "macOS" ]; then
            curl -L --retry 3 -o libtorch.zip \
              "https://download.pytorch.org/libtorch/cpu/libtorch-macos-arm64-shared-with-deps-${LIBTORCH_VERSION}.zip"
          else
            curl -L --retry 3 -o libtorch.zip \
              "https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-${LIBTORCH_VERSION}%2Bcpu.zip"
          fi
          mkdir -p "$GITHUB_WORKSPACE/libtorch-install"
          unzip -q libtorch.zip -d "$GITHUB_WORKSPACE/libtorch-install"
          rm libtorch.zip

      - name: Configure
        shell: bash
        run: |
          quality_flags=()
          if [ "$RUNNER_OS" == "Linux" ] && [ "${{ matrix.build_type }}" == "Release" ]; then
            quality_flags+=(
              -DJYPPX_BUILD_DOCS=ON
              -DJYPPX_ENABLE_CLANG_TIDY=ON
              -DJYPPX_ENABLE_FORMAT_CHECK=ON
            )
          fi
          cmake -S . -B build \
            -DJYPPX_BUILD_TESTS=ON \
            -DJYPPX_BUILD_EXAMPLES=ON \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/libtorch-install/libtorch" \
            "${quality_flags[@]}"

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Validate foundation API documentation
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        run: cmake --build build --config Release --target jyppx_foundation_docs

      - name: Test
        shell: bash
        env:
          # The LibTorch prefix is non-standard on Linux/macOS; the Windows
          # loader is covered by the POST_BUILD DLL copy next to the exes.
          LD_LIBRARY_PATH: ${{ github.workspace }}/libtorch-install/libtorch/lib
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/libtorch-install/libtorch/lib
        run: |
          # Windows needs the multi-config -C flag; single-config generators
          # must not see it (it would filter out every test).
          if [ "$RUNNER_OS" == "Windows" ]; then
            ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/Testing/Temporary/LastTest.log
            **/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore

  coverage:
    name: Ubuntu / coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr

      - name: Validate dependency inputs
        run: |
          python tools/compatibility.py --file compatibility.json --validate
          python tools/dependency_manifest.py --file dependency-manifest.json
          echo "LIBTORCH_VERSION=$(python tools/compatibility.py --file compatibility.json --version compatibility_candidate)" >> "$GITHUB_ENV"

      - name: Download LibTorch (CPU)
        run: |
          curl -L --retry 3 -o libtorch.zip \
            "https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-${LIBTORCH_VERSION}%2Bcpu.zip"
          mkdir -p "$GITHUB_WORKSPACE/libtorch-install"
          unzip -q libtorch.zip -d "$GITHUB_WORKSPACE/libtorch-install"

      - name: Configure, build, test, and collect coverage
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/libtorch-install/libtorch
          LD_LIBRARY_PATH: ${{ github.workspace }}/libtorch-install/libtorch/lib
        run: bash tools/run-coverage.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: out/coverage/linux/report

  sanitizer:
    name: Ubuntu / ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate dependency inputs
        run: |
          python tools/compatibility.py --file compatibility.json --validate
          python tools/dependency_manifest.py --file dependency-manifest.json
          echo "LIBTORCH_VERSION=$(python tools/compatibility.py --file compatibility.json --version compatibility_candidate)" >> "$GITHUB_ENV"

      - name: Download LibTorch (CPU)
        run: |
          curl -L --retry 3 -o libtorch.zip \
            "https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-${LIBTORCH_VERSION}%2Bcpu.zip"
          mkdir -p "$GITHUB_WORKSPACE/libtorch-install"
          unzip -q libtorch.zip -d "$GITHUB_WORKSPACE/libtorch-install"

      - name: Configure
        run: |
          cmake -S . -B out/sanitizer/linux/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DJYPPX_BUILD_TESTS=ON \
            -DJYPPX_BUILD_EXAMPLES=OFF \
            -DJYPPX_BUILD_BENCHMARKS=OFF \
            -DJYPPX_ENABLE_ASAN=ON \
            -DJYPPX_ENABLE_UBSAN=ON \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/libtorch-install/libtorch"

      - name: Build and test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/libtorch-install/libtorch/lib
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake --build out/sanitizer/linux/build --parallel 2
          ctest --test-dir out/sanitizer/linux/build --output-on-failure
