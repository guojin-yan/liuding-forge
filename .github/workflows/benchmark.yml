name: Benchmarks

on:
  workflow_dispatch:

jobs:
  benchmark:
    name: CPU benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate compatibility source
        shell: bash
        run: |
          python scripts/validation/compatibility.py --file compatibility.json --validate
          echo "LIBTORCH_VERSION=$(python scripts/validation/compatibility.py --file compatibility.json --version compatibility_candidate)" >> "$GITHUB_ENV"
          python scripts/validation/dependency_manifest.py --file dependency-manifest.json
      - name: Download LibTorch (CPU)
        shell: bash
        run: |
          set -e
          curl -L --retry 3 -o libtorch.zip \
            "https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-${LIBTORCH_VERSION}%2Bcpu.zip"
          mkdir -p "$GITHUB_WORKSPACE/libtorch-install"
          unzip -q libtorch.zip -d "$GITHUB_WORKSPACE/libtorch-install"
      - name: Configure
        # Benchmark targets currently live under tests/CMakeLists.txt.
        run: cmake -S . -B out/build/benchmark -DJYPPX_LIUDING_BUILD_TESTS=ON -DJYPPX_LIUDING_BUILD_EXAMPLES=OFF -DJYPPX_LIUDING_BUILD_BENCHMARKS=ON -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/libtorch-install/libtorch"
      - name: Build benchmarks
        run: cmake --build out/build/benchmark --config Release --parallel 2
      - name: Run benchmarks
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/libtorch-install/libtorch/lib
        run: |
          mkdir -p out/benchmarks/results
          out/build/benchmark/tests/benchmarks/liuding-forge-bench-trainer-throughput > out/benchmarks/results/trainer_throughput.csv
          out/build/benchmark/tests/benchmarks/liuding-forge-bench-optimizer-convergence > out/benchmarks/results/optimizer_convergence.csv
          out/build/benchmark/tests/benchmarks/liuding-forge-bench-adadelta-native-throughput > out/benchmarks/results/adadelta_native_throughput.csv
          out/build/benchmark/tests/benchmarks/liuding-forge-bench-nadam-native-throughput > out/benchmarks/results/nadam_native_throughput.csv
          out/build/benchmark/tests/benchmarks/liuding-forge-bench-memory-usage > out/benchmarks/results/memory_usage.csv
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: out/benchmarks/results/*.csv
